<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Curve</title>
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Curve" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Drifting background. Three soft radial blobs, animated with transform only --
       no filter, which Safari would have to re-rasterise every frame. -->
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="login-wrap" id="login">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand"><span class="mark"></span> Curve</div>
      <p class="sub">Sign in to unlock.</p>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required />

      <label class="check" for="remember">
        <input type="checkbox" id="remember" />
        <span>Stay signed in on this iPhone</span>
      </label>

      <button class="btn primary" id="signin" type="submit">Sign in</button>
      <div class="login-error hidden" id="login-error"></div>
    </form>
  </div>

  <div class="app hidden" id="app">
    <main id="screen"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="today"  class="tab on"><span class="ico" data-i="today"></span>Today</button>
      <button data-tab="grades" class="tab"><span class="ico" data-i="grades"></span>Grades</button>
      <button data-tab="work"   class="tab"><span class="ico" data-i="work"></span>Work</button>
      <button data-tab="me"     class="tab"><span class="ico" data-i="me"></span>Me</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
