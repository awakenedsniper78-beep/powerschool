# Runs the assignments diagnosis from a GitHub runner.
#
# The portal's bot protection currently blocks the home connection but lets the runner
# through, so this is the only place the check can actually sign in. Run it by hand from
# the Actions tab; it is never scheduled.
#
# Output goes to the run log, which is PUBLIC on a public repository, so it runs in
# --safe mode: counts, column labels and structure only. No grades, no course names,
# no page text.

name: Diagnose assignments

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inspect the assignments pages
        env:
          PS_BASE_URL: https://birmingham.powerschool.com
          PS_USERNAME: ${{ secrets.PS_USERNAME }}
          PS_PASSWORD: ${{ secrets.PS_PASSWORD }}
        run: python diagnose.py --safe
